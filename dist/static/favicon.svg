<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="KM">
  <!-- The knowledge base's tab icon. Letters are STROKED PATHS, not text:
       a favicon carries no font with it, so a text element would render
       in whatever the browser happened to pick. K and M are both
       straight-line letters, so drawing them costs nothing and makes the
       result identical everywhere. Coordinates match favicon-32.png,
       which was rendered and looked at to check it stays legible at tab
       size. The colour is this site's own accent, the value base.html
       gives its accent custom property. -->
  <rect width="32" height="32" rx="6" fill="#0b5cab"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <path d="M5 6.5V25.5"/>
    <path d="M12.4 6.5L5 16l7.4 9.5"/>
    <path d="M17.8 25.5V6.5l5.4 11.1L28.6 6.5v19"/>
  </g>
</svg>
